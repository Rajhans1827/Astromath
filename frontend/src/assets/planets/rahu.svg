<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Dark Cosmic Void Gradient -->
    <radialGradient id="rahuVoid" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="35%" stop-color="#2E1065" />
      <stop offset="70%" stop-color="#0F051D" />
      <stop offset="100%" stop-color="#020005" />
    </radialGradient>
    
    <!-- Outer Eclipse Aura -->
    <radialGradient id="eclipseAura" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <filter id="rahuGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Violet Eclipse Corona -->
  <circle cx="100" cy="100" r="88" fill="url(#eclipseAura)" filter="url(#rahuGlow)" />

  <!-- Mysterious Swirling Plasma Filaments -->
  <path d="M 40 90 Q 70 50 120 60 Q 160 70 150 110 Q 140 150 90 140 Q 50 130 40 90 Z" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.4" />
  <path d="M 55 110 Q 70 145 115 140 Q 155 135 145 95 Q 135 60 95 65 Q 60 70 55 110 Z" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.35" />

  <!-- Rahu Shadow Core -->
  <circle cx="100" cy="100" r="62" fill="url(#rahuVoid)" />

  <!-- Glowing Eclipse Crescent Edge -->
  <path d="M 52 100 A 58 58 0 0 1 100 42 A 62 62 0 0 0 100 158 A 58 58 0 0 1 52 100 Z" fill="#C4B5FD" opacity="0.85" filter="blur(2px)" />

  <!-- Inner Vortex Singularity Core -->
  <circle cx="100" cy="100" r="16" fill="#000000" stroke="#7C3AED" stroke-width="1" opacity="0.9" />
</svg>
