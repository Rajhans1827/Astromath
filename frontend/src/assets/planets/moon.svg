<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="moonGlow" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </radialGradient>
    <filter id="lunarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="moonDisc">
      <circle cx="100" cy="100" r="72" />
    </clipPath>
  </defs>

  <!-- Outer Luminous Aura -->
  <circle cx="100" cy="100" r="76" fill="#CBD5E1" opacity="0.25" filter="url(#lunarGlow)" />

  <!-- Moon Spherical Base -->
  <circle cx="100" cy="100" r="72" fill="url(#moonGlow)" />

  <!-- Lunar Maria (Dark Basalt Plains) & Craters clipped to sphere -->
  <g clip-path="url(#moonDisc)">
    <!-- Sea of Tranquility / Serenitatis -->
    <path d="M 80 50 Q 110 45 125 70 Q 115 95 90 90 Q 75 75 80 50 Z" fill="#334155" opacity="0.45" />
    <path d="M 60 90 Q 80 85 95 110 Q 75 135 55 120 Q 50 100 60 90 Z" fill="#334155" opacity="0.4" />
    <path d="M 115 105 Q 140 100 150 125 Q 130 145 110 135 Z" fill="#1E293B" opacity="0.45" />
    
    <!-- Tycho & Copernicus Impact Craters -->
    <circle cx="105" cy="140" r="7" fill="#CBD5E1" stroke="#475569" stroke-width="1.5" />
    <line x1="105" y1="140" x2="80" y2="160" stroke="#F1F5F9" stroke-width="0.75" opacity="0.6" />
    <line x1="105" y1="140" x2="135" y2="155" stroke="#F1F5F9" stroke-width="0.75" opacity="0.6" />
    <line x1="105" y1="140" x2="115" y2="110" stroke="#F1F5F9" stroke-width="0.75" opacity="0.6" />

    <circle cx="70" cy="65" r="5" fill="#94A3B8" stroke="#334155" stroke-width="1.2" />
    <circle cx="130" cy="80" r="6" fill="#94A3B8" stroke="#334155" stroke-width="1.2" />
    <circle cx="125" cy="125" r="4" fill="#64748B" />
    
    <!-- Terminator Shadow Layer (3D Depth) -->
    <path d="M 100 28 A 72 72 0 0 1 172 100 A 72 72 0 0 1 100 172 A 72 80 0 0 0 100 28 Z" fill="#0F172A" opacity="0.45" />
  </g>
</svg>
