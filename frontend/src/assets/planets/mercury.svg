<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="mercGrad" cx="38%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="65%" stop-color="#64748B" />
      <stop offset="90%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <clipPath id="mercDisc">
      <circle cx="100" cy="100" r="56" />
    </clipPath>
  </defs>

  <!-- Luminous Edge -->
  <circle cx="100" cy="100" r="58" fill="#94A3B8" opacity="0.25" filter="blur(4px)" />

  <!-- Mercury Sphere -->
  <circle cx="100" cy="100" r="56" fill="url(#mercGrad)" />

  <g clip-path="url(#mercDisc)">
    <!-- Caloris Basin and Wrinkle Ridges -->
    <circle cx="75" cy="85" r="14" fill="#475569" stroke="#64748B" stroke-width="1.2" opacity="0.7" />
    <circle cx="120" cy="115" r="9" fill="#334155" stroke="#475569" stroke-width="1" opacity="0.8" />
    <circle cx="85" cy="130" r="6" fill="#1E293B" opacity="0.85" />
    <circle cx="115" cy="70" r="7" fill="#475569" opacity="0.6" />
    
    <!-- Heavy Crater Rays -->
    <line x1="75" y1="85" x2="55" y2="70" stroke="#CBD5E1" stroke-width="0.8" opacity="0.4" />
    <line x1="75" y1="85" x2="95" y2="60" stroke="#CBD5E1" stroke-width="0.8" opacity="0.4" />
    
    <!-- 3D Shadow -->
    <path d="M 100 44 A 56 56 0 0 1 156 100 A 56 56 0 0 1 100 156 A 56 64 0 0 0 100 44 Z" fill="#020617" opacity="0.6" />
  </g>
</svg>
